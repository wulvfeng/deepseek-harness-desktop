<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>PyQt6 WebEngine 模板 - 演示页</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fa; color: #1f2937; }
    .wrap { max-width: 640px; margin: 80px auto; padding: 40px; background: #fff;
            border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08); text-align: center; }
    h1 { font-size: 24px; }
    p  { color: #6b7280; }
    .tag { display: inline-block; margin: 4px; padding: 4px 12px; border-radius: 999px;
           background: #eef2ff; color: #4338ca; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>本地静态文件服务已生效</h1>
    <p>当前页面由模板的“静态文件目录”模式提供，可直接替换本文件夹内的静态资源。</p>
    <div>
      <span class="tag">PyQt6 WebEngine</span>
      <span class="tag">SQLite 配置</span>
      <span class="tag">静态目录 / npm run dev</span>
    </div>
  </div>
</body>
</html>
